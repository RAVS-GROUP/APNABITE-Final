<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Login securely to ApnaBite using mobile OTP"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Login | ApnaBite</title>

  <link
    rel="stylesheet"
    href="shared/css/reset.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/variables.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/common.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/components.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/auth-pages.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/responsive.css"
  >
</head>

<body>

  <main
    class="auth-page"
    id="authPage"
  >

    <header class="auth-header">

      <a
        class="auth-back"
        href="index.html"
        aria-label="Back to location"
      >
        ←
      </a>

      <div class="auth-brand">

        <div
          class="auth-brand-mark"
          aria-hidden="true"
        >
          A
        </div>

        <span>ApnaBite</span>

      </div>

    </header>


    <section class="auth-content">

      <div class="auth-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="6"
            y="2"
            width="12"
            height="20"
            rx="2"
          ></rect>

          <path d="M10 18h4"></path>
        </svg>
      </div>


      <div id="mobileStep">

        <h1 class="auth-title">
          Welcome back
        </h1>

        <p class="auth-description">
          Enter your registered mobile number to receive
          a secure login OTP.
        </p>


        <form
          class="auth-form"
          id="mobileForm"
          novalidate
        >

          <label for="mobileInput">
            Mobile number
          </label>

          <div class="mobile-input-wrap">

            <span class="mobile-prefix">
              +91
            </span>

            <input
              id="mobileInput"
              class="auth-input mobile-input"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              maxlength="10"
              placeholder="Enter 10-digit number"
              aria-describedby="authMessage"
              required
            >

          </div>


          <button
            class="app-button app-button-primary"
            id="sendOtpButton"
            type="submit"
          >
            Send OTP
          </button>

        </form>

      </div>


      <div
        class="hidden"
        id="otpStep"
      >

        <h1 class="auth-title">
          Verify OTP
        </h1>

        <p class="auth-description">
          Enter the 6-digit OTP sent for
          <strong id="maskedMobile"></strong>.
        </p>


        <div
          class="test-otp-box hidden"
          id="testOtpBox"
        >
          Development test OTP:
          <strong id="testOtpValue"></strong>
        </div>


        <form
          class="auth-form"
          id="otpForm"
          novalidate
        >

          <label for="otpInput">
            One-time password
          </label>

          <input
            id="otpInput"
            class="auth-input otp-input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="••••••"
            required
          >


          <button
            class="app-button app-button-primary"
            id="verifyOtpButton"
            type="submit"
          >
            Verify and Login
          </button>

        </form>


        <div class="auth-secondary-actions">

          <button
            class="auth-text-button"
            id="changeMobileButton"
            type="button"
          >
            Change mobile number
          </button>

          <button
            class="auth-text-button"
            id="resendOtpButton"
            type="button"
            disabled
          >
            Resend OTP in 60s
          </button>

        </div>

      </div>


      <div
        class="auth-success hidden"
        id="successStep"
      >

        <div
          class="auth-success-mark"
          aria-hidden="true"
        >
          ✓
        </div>

        <h1 class="auth-title">
          Login successful
        </h1>

        <p
          class="auth-description"
          id="successMessage"
        >
          Your secure ApnaBite session is ready.
        </p>

      </div>


      <div
        class="auth-message hidden"
        id="authMessage"
        role="alert"
        aria-live="polite"
      ></div>

    </section>


    <footer class="auth-footer">
      Secure OTP login • ApnaBite
    </footer>

  </main>


  <script src="shared/js/storage.js"></script>
  <script src="shared/js/api.js"></script>
  <script src="shared/js/session.js"></script>
  <script src="shared/js/auth.js"></script>
  <script src="shared/js/login-page.js"></script>

</body>
</html>
