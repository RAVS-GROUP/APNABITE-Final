<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Create your secure ApnaBite account"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Register | ApnaBite</title>

  <link
    rel="stylesheet"
    href="shared/css/reset.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/variables.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/common.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/components.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/auth-pages.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/responsive.css"
  >
</head>

<body>

  <main class="auth-page">

    <header class="auth-header">

      <a
        class="auth-back"
        href="index.html"
        aria-label="Back to location"
      >
        ←
      </a>

      <div class="auth-brand">

        <div
          class="auth-brand-mark"
          aria-hidden="true"
        >
          A
        </div>

        <span>ApnaBite</span>

      </div>

    </header>


    <section class="auth-content">

      <div
        class="auth-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
          ></path>

          <circle
            cx="9"
            cy="7"
            r="4"
          ></circle>

          <path d="M19 8v6"></path>
          <path d="M22 11h-6"></path>
        </svg>
      </div>


      <div id="registrationStep">

        <h1 class="auth-title">
          Create your account
        </h1>

        <p class="auth-description">
          Register securely using your mobile number and OTP.
        </p>


        <form
          class="auth-form"
          id="registrationForm"
          novalidate
        >

          <label for="registrationMobile">
            Mobile number
          </label>

          <div class="mobile-input-wrap">

            <span class="mobile-prefix">
              +91
            </span>

            <input
              id="registrationMobile"
              class="auth-input mobile-input"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              maxlength="10"
              placeholder="Enter 10-digit number"
              required
            >

          </div>


          <label for="registrationRole">
            Register as
          </label>

          <select
            id="registrationRole"
            class="auth-input"
            required
          >
            <option value="">
              Select your role
            </option>

            <option value="Customer">
              Customer
            </option>

            <option value="Food Partner">
              Food Partner
            </option>

            <option value="Rider">
              Delivery Partner
            </option>
          </select>


          <label for="registrationEmail">
            Email address (optional)
          </label>

          <input
            id="registrationEmail"
            class="auth-input"
            type="email"
            autocomplete="email"
            placeholder="name@example.com"
          >


          <label for="registrationLanguage">
            Preferred language
          </label>

          <select
            id="registrationLanguage"
            class="auth-input"
          >
            <option value="en">
              English
            </option>

            <option value="hi">
              हिन्दी
            </option>
          </select>


          <button
            class="app-button app-button-primary"
            id="requestRegistrationOtpButton"
            type="submit"
          >
            Continue with OTP
          </button>

        </form>


        <p class="auth-description">
          Already registered?
          <a href="login.html">
            Login securely
          </a>
        </p>

      </div>


      <div
        class="hidden"
        id="registrationOtpStep"
      >

        <h1 class="auth-title">
          Verify mobile
        </h1>

        <p class="auth-description">
          Enter the 6-digit OTP sent for
          <strong id="registrationMaskedMobile"></strong>.
        </p>


        <div
          class="test-otp-box hidden"
          id="registrationTestOtpBox"
        >
          Development test OTP:
          <strong id="registrationTestOtpValue"></strong>
        </div>


        <form
          class="auth-form"
          id="registrationOtpForm"
          novalidate
        >

          <label for="registrationOtp">
            One-time password
          </label>

          <input
            id="registrationOtp"
            class="auth-input otp-input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="••••••"
            required
          >


          <button
            class="app-button app-button-primary"
            id="verifyRegistrationOtpButton"
            type="submit"
          >
            Verify and Create Account
          </button>

        </form>


        <div class="auth-secondary-actions">

          <button
            class="auth-text-button"
            id="editRegistrationButton"
            type="button"
          >
            Edit details
          </button>

          <button
            class="auth-text-button"
            id="resendRegistrationOtpButton"
            type="button"
            disabled
          >
            Resend OTP in 60s
          </button>

        </div>

      </div>


      <div
        class="auth-success hidden"
        id="registrationSuccessStep"
      >

        <div
          class="auth-success-mark"
          aria-hidden="true"
        >
          ✓
        </div>

        <h1 class="auth-title">
          Account created
        </h1>

        <p
          class="auth-description"
          id="registrationSuccessMessage"
        >
          Your verified ApnaBite account is ready.
        </p>


        <button
          class="app-button app-button-primary"
          id="goToLoginButton"
          type="button"
          style="margin-top: 24px;"
        >
          Continue to Login
        </button>

      </div>


      <div
        class="auth-message hidden"
        id="registrationMessage"
        role="alert"
        aria-live="polite"
      ></div>

    </section>


    <footer class="auth-footer">
      Secure OTP registration • ApnaBite
    </footer>

  </main>


  <script src="shared/js/storage.js"></script>
  <script src="shared/js/api.js"></script>
  <script src="shared/js/session.js"></script>
  <script src="shared/js/auth.js"></script>
  <script src="shared/js/register-page.js"></script>

</body>
</html>
