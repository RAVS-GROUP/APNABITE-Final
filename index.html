<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="ApnaBite - Apna Swaad, Apni Pasand"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>ApnaBite</title>

  <link
    rel="stylesheet"
    href="shared/css/reset.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/variables.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/common.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/components.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/launch.css"
  >

  <link
    rel="stylesheet"
    href="shared/css/responsive.css"
  >
</head>

<body>

  <main id="app">

    <section
      class="launch-splash"
      id="launchSplash"
      aria-labelledby="launchBrandName"
    >

      <div class="launch-brand">

        <!--
          Custom ApnaBite logo upload hone ke baad
          isi element ko image se replace karenge.
        -->

        <div
          class="launch-logo"
          aria-hidden="true"
        >
          A
        </div>

        <h1 id="launchBrandName">
          ApnaBite
        </h1>

        <p>
          Apna Swaad, Apni Pasand
        </p>

      </div>


      <div class="launch-location-status">

        <span id="launchStatusText">
          Opening ApnaBite...
        </span>

      </div>


      <div
        class="launch-spinner"
        aria-hidden="true"
      ></div>

    </section>

  </main>


  <!--
    FAST LAUNCH FILES ONLY

    Backend API, location, cart and other application files
    root splash par load nahi honge. Isse launch lightweight rahega.
  -->

  <script src="shared/js/storage.js"></script>
  <script src="shared/js/session.js"></script>
  <script src="shared/js/app-router.js"></script>
  <script src="shared/js/launch.js"></script>


  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register("./sw.js")
            .then(
              function() {

                console.log(
                  "ApnaBite Service Worker registered."
                );
              }
            )
            .catch(
              function(error) {

                console.error(
                  "Service Worker registration failed:",
                  error
                );
              }
            );
        }
      );
    }
  </script>

</body>
</html>
